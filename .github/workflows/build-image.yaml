name: build-image

# Builds the CV container (Dockerfile -> ghcr.io/tarensanders/cv) and pushes it.
# Runs when the image inputs change, plus weekly
on:
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - renv.lock
      - cv/awesome-cv.tex
      - .github/workflows/build-image.yaml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tarensanders/cv

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Always re-resolve the FROM base from the registry; otherwise the
          # gha cache can serve a stale r-base layer and the weekly rebuild is a
          # no-op.
          pull: true
          secrets: |
            github_pat=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
